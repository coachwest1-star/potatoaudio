<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Potato Audio</title><link rel="stylesheet" href="/style.css"></head><body><div class="app"><aside><div class="brand">🥔 <span>POTATO AUDIO</span><small>v2</small></div><button class="nav active" data-view="now">Now Playing</button><button class="nav" data-view="library">Library</button><button class="nav" data-view="radio">Radio</button><button class="nav" data-view="queue">Queue</button><button class="nav" data-view="settings">Audio</button><div class="status" id="connection">Connecting…</div></aside><main><section id="now" class="view"><div class="now-wrap"><div class="art">♫</div><div class="eyebrow">NOW PLAYING</div><h1 id="title">Nothing playing</h1><h2 id="artist">Potato Audio</h2><div class="now-meta" id="nowMeta"></div><div class="progress"><div id="progress"></div></div><div class="times"><span id="elapsed">0:00</span><span id="duration">0:00</span></div><div class="controls"><button onclick="ctl('previous')">⏮</button><button class="play" id="play" onclick="togglePlay()">▶</button><button onclick="ctl('next')">⏭</button></div><label class="volume">🔊 <input id="vol" type="range" min="0" max="100" value="50"></label></div></section><section id="library" class="view hidden"><div class="topline"><div><div class="eyebrow">MUSIC</div><h1>Library</h1></div><button class="primary" onclick="scan()">Rescan</button></div><input id="search" class="search" placeholder="Search songs, artists or albums"><div id="libraryList" class="list"></div></section><section id="radio" class="view hidden"><div class="topline"><div><div class="eyebrow">INTERNET RADIO</div><h1>Stations</h1></div><button class="primary" onclick="showAddStation()">＋ Add Station</button></div><div id="stationForm" class="panel hidden"><div class="form-grid"><label>Name<input id="stationName" placeholder="WSM 650"></label><label>Category<input id="stationCategory" placeholder="Country"></label><label class="wide">Stream URL<input id="stationUrl" placeholder="https://stream.example.com/live"></label><label class="wide">Logo URL<input id="stationLogo" placeholder="https://.../logo.png"></label></div><div class="form-actions"><button onclick="cancelStation()">Cancel</button><button class="primary" onclick="saveStation()">Save Station</button></div></div><div id="radioList" class="radio-grid"></div></section><section id="queue" class="view hidden"><div class="topline"><div><div class="eyebrow">UP NEXT</div><h1>Queue</h1></div><button onclick="clearQueue()">Clear</button></div><div id="queueList" class="list"></div></section><section id="settings" class="view hidden"><div class="eyebrow">OUTPUT</div><h1>Audio Devices</h1><p class="muted">Choose HDMI or a connected USB DAC.</p><div id="devices" class="cards"></div></section></main></div><script src="/app.js"></script></body></html>
